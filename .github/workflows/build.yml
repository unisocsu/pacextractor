name: Build pacextractor

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Verify
        run: |
          file pacextractor
          ./pacextractor --help || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pacextractor-linux-x64
          path: pacextractor
          if-no-files-found: error
