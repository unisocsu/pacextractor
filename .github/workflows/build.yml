name: Build pacextractor

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux
        run: make

      - name: Verify
        run: file pacextractor

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: pacextractor-linux-x64
          path: pacextractor
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build Windows x64
        shell: msys2 {0}
        run: |
          make clean
          make CC=gcc CFLAGS="-O2 -Wall"

      - name: Verify Windows binary
        shell: pwsh
        run: |
          if (-not (Test-Path "pacextractor.exe")) {
            throw "pacextractor.exe was not created"
          }
          Get-Item "pacextractor.exe"

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: pacextractor-windows-x64
          path: pacextractor.exe
          if-no-files-found: error
